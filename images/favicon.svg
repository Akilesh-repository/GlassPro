<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="15" y1="10" x2="49" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="32" y1="2" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Glass Highlight -->
  <rect x="3" y="3" width="58" height="26" rx="13" fill="url(#glossGrad)"/>

  <!-- Protective Glass Shield -->
  <path d="M32 10C32 10 45 14.5 49 18C49 32 44.5 45 32 53C19.5 45 15 32 15 18C19 14.5 32 10 32 10Z" fill="url(#shieldGrad)"/>

  <!-- Window Tint Split Effect (Deep Tint on Right Half) -->
  <path d="M32 10C32 10 45 14.5 49 18C49 32 44.5 45 32 53V10Z" fill="#0B1120" fill-opacity="0.45"/>

  <!-- Windshield Silhouette -->
  <path d="M23 23H41L44 38H20L23 23Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rearview Mirror -->
  <line x1="32" y1="23" x2="32" y2="26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <rect x="30" y="26" width="4" height="2" rx="0.5" fill="#FFFFFF"/>

  <!-- Dynamic Glass Glare Sheen Lines -->
  <path d="M27 25L24 36" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M30 25L28 34" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Clarity Sparkle Star -->
  <path d="M48 8L49.5 12.5L54 14L49.5 15.5L48 20L46.5 15.5L42 14L46.5 12.5L48 8Z" fill="#FFFFFF"/>
  <circle cx="48" cy="14" r="1.5" fill="#38BDF8"/>
</svg>
